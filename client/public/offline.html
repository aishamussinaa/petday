<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetDay · Offline</title><style>body{font:18px/1.6 system-ui;margin:0;padding:10vh 24px;background:#fff8ec;color:#362438}main{max-width:560px;margin:auto}h1{font-size:44px}button{font:inherit;padding:12px 24px;border-radius:32px;background:#362438;color:#fff8ec;border:0;cursor:pointer}@media(prefers-color-scheme:dark){body{background:#201c24;color:#f5eddf}button{background:#f5eddf;color:#201c24}}</style><main><h1>PetDay.</h1><h2 id="title">Нет подключения</h2><p id="message">Подключитесь к интернету, чтобы открыть питомцев и сохранить записи.</p><button id="retry" onclick="location.reload()">Попробовать снова</button></main><script>try{const lang=localStorage.getItem('petday.language')||document.documentElement.lang;const copy=lang.startsWith('kk')?['Байланыс жоқ','Жануарлар мен жазбаларды ашу үшін интернетке қосылыңыз.','Қайталау']:lang.startsWith('en')?['You are offline','Connect to the internet to open your pets and save records.','Try again']:null;if(copy){document.documentElement.lang=lang;['title','message','retry'].forEach((id,i)=>document.getElementById(id).textContent=copy[i]);}}catch{}</script></html>
