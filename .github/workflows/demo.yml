name: Demo build, walks and vet PDF

on: [push]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the public demo
        run: npm run build:demo
      - name: Set up Chrome for Playwright
        run: npx --no-install playwright install --with-deps chrome
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF text reader
        run: python -m pip install pypdf==6.21.4
      - name: Test walks and downloaded vet summaries in the built demo
        run: npm run test:demo
